","material":"Dumbbells"},{"id":"new5","category":"Kracht & conditie","name":"Box step-up met kniehef","goal":"Beenkracht en loopcoördinatie","execution":"Stap op box en hef het vrije been tot heuphoogte.","attention":"Box stabiel, stap gecontroleerd af.","visual":"step","material":"Jump box"},{"id":"new6","category":"Kracht & conditie","name":"Box jump","goal":"Explosiviteit","execution":"Spring met twee voeten op lage stevige box en stap rustig af.","attention":"Kies passende hoogte; zachte landing.","visual":"jump","material":"Jump box"},{"id":"new7","category":"Kracht & conditie","name":"Slam ball overhead slam","goal":"Explosieve romp- en armkracht","execution":"Breng slam ball boven hoofd en werp krachtig recht voor je op de grond.","attention":"Voldoende vrije ruimte; gebruik alleen geschikte slam ball.","visual":"standing","material":"Slam ball"},{"id":"new8","category":"Kracht & conditie","name":"Slam ball squat","goal":"Benen en romp","execution":"Houd slam ball voor borst en voer gecontroleerde squats uit.","attention":"Hielen aan de grond; rug neutraal.","visual":"squat","material":"Slam ball"},{"id":"new9","category":"Core","name":"BOSU plank","goal":"Rompstabiliteit","execution":"Steun met onderarmen op de stabiel geplaatste BOSU en houd plankpositie.","attention":"Bouw op vanuit gewone plank; geen wiebelen forceren.","visual":"plank","material":"BOSU-bal"},{"id":"new10","category":"Core","name":"BOSU dead bug","goal":"Corecontrole en balans","execution":"Lig stabiel op de BOSU met voeten op vloer en voer gecontroleerde armbewegingen uit.","attention":"Alleen indien stabiele positie mogelijk; anders op matje.","visual":"floor","material":"BOSU-bal"},{"id":"new11","category":"Kracht & conditie","name":"Balans op halve BOSU","goal":"Enkel- en heupstabiliteit","execution":"Sta op halve BOSU met licht gebogen knieën en houd balans.","attention":"Zorg voor steun dichtbij; geen sprongen op instabiele ondergrond.","visual":"standing","material":"Halve BOSU-ba return a.length?a:[x.category==='Core'?'Buikspieren':'Quadriceps (bovenbenen)']}
function muscleTags(x){return muscleGroups(x).map(m=>`<span class="tag">${esc(m)}</span>`).join(' ')}
function library(){let list=exercises.filter(x=>(category==='Alles'||x.category===category)&&(muscleFilter==='Alle spiergroepen'||muscleGroups(x).includes(muscleFilter))&&[x.name,x.goal,x.execution,x.attention,x.material].join(' ').toLowerCase().includes(filter.toLowerCase()));return `<div class="row between"><div><div class="eyebrow">Centrale catalogus</div><h1 class="headline">Oefenbibliotheek</h1><p class="lead">${exercises.length} oefeningen · filter op spiergroep · volledig bewerkbaar.</p></div><button class="btn" onclick="openEdit(null)">+ Oefening toevoegen</button></div><div class="row section"><input class="field" style="flex:2" placeholder="Zoek op naam, doel of uitvoering..." value="${esc(filter)}" oninput="filter=this.value;render(true)"><select class="field" style="flex:1" onchange="category=this.value;render()">${['Alles','Core','Kracht & conditie'].map(c=>`<option ${category===c?'selected':''}>${c}</option>`).join('')}</select><select class="field" style="flex:1" aria-label="Filter op spiergroep" onchange="muscleFilter=this.value;render()"><option>Alle spiergroepen</option>${MUSCLES.map(m=>`<option ${muscleFilter===m?'selected':''}>${m}</option>`).join('')}</select></div><p class="mini">${list.length} resultaten</p><div class="grid">${list.map(x=>`<div class="exercise">${exerciseArt(x)}<div style="min-width:0;flex:1"><h3>${esc(x.name)}</h3><p>${esc(x.goal)}</p><p class="mini">${esc(x.material||'Geen')}</p><div class="row" style="gap:4px;flex-wrap:wrap">${muscleTags(x)}</div><div class="row" style="margin-top:9px"><button class="btn small secondary" onclick="showExercise('${x.id}')">Bekijk</button><button class="btn small ghost" onclick="openEdit('${x.id}')">Wijzig</button></div></div></div>`).join('')}</div>${list.length?'':'<div class="empty">Geen oefeningen gevonden.</div>'}`}
function showExercise(id){let x=exercises.find(x=>x.id===id);if(!x)return;modal=`<div class="row between"><span class="pill">${esc(x.category)}</span><button class="btn ghost small" onclick="closeModal()">Sluiten ✕</button></div><h2>${esc(x.name)}</h2><div class="detail-visual">${exerciseArt(x)}</div><p class="note">Schematische houding ter oriëntatie; geen exacte bewegingsanimatie.</p><div class="detail-grid"><div><b>Doel</b><p>${esc(x.goal)}</p></div><div><b>Uitvoering</b><p>${esc(x.execution)}</p></div><div><b>Aandachtspunten</b><p>${esc(x.attention)}</p></div><div><b>Categorie</b><p>${esc(x.category)}</p></div><div><b>Materiaal</b><p>${esc(x.material||'Geen')}</p></div><div><b>Spiergroepen</b><p>${muscleGroups(x).map(esc).join(', ')}</p></div></div><div class="section"><h3>Toevoegen aan huidige concepttraining</h3><p class="mini">Kies het onderdeel. De oefening wordt meteen opgeslagen in de trainingsplanner.</p><div class="row"><button class="btn" onclick="addFromDetail('${x.id}','core')">+ Toevoegen aan Core</button><button class="btn secondary" onclick="addFromDetail('${x.id}','main')">+ Toevoegen aan Kerntraining</button></div></div><div class="row section"><button class="btn" onclick="openEdit('${x.id}')">Bewerk oefening</button><button class="btn danger" onclick="removeExercise('${x.id}')">Verwijder</button></div>`;render()}

function openEdit(id){editId=id;let x=exercises.find(e=>e.id===id)||{name:'',goal:'',execution:'',attention:'',category:'Core',visual:'standing',material:'Geen'};modal=`<div class="row between"><h2>${id?'Oefening wijzigen':'Nieuwe oefening'}</h2><button class="btn ghost small" onclick="closeModal()">Sluiten ✕</button></div><form onsubmit="saveExercise(event)"><div class="form-grid"><div><label>Naam</label><input required name="name" class="field" value="${esc(x.name)}"></div><div><label>Categorie</label><select name="category" class="field"><option ${x.category==='Core'?'selected':''}>Core</option><option ${x.category==='Kracht & conditie'?'selected':''}>Kracht & conditie</option></select></div></div><div class="section"><label>Materiaal</label><select name="material" class="field">${['Geen','Matje','Dumbbells','Barbell','Kettlebell','Jump box','Slam ball','BOSU-bal','Halve BOSU-bal','Kettlebell / dumbbell','Barbell / dumbbells / kettlebell'].map(m=>`<option ${x.material===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="section"><label>Spiergroepen (meerdere mogelijk)</label><div class="row" style="flex-wrap:wrap;gap:8px">${MUSCLES.map(m=>`<label class="check" style="margin:0"><input type="checkbox" name="muscles" value="${esc(m)}" ${muscleGroups(x).includes(m)?'checked':''}> ${esc(m)}</label>`).join('')}</div></div><div class="section"><label>Doel</label><textarea required name="goal" class="field">${esc(x.goal)}</textarea></div><div class="section"><label>Uitvoering</label><textarea required name="execution" class="field">${esc(x.execution)}</textarea></div><div class="section"><label>Aandachtspunten</label><textarea required name="attention" class="field">${esc(x.attention)}</textarea></div><div class="section"><label>Visuele houding (schematisch)</label><select name="visual" class="field">${['standing','plank','side','floor','bridge','quadruped','seated','squat','lunge','jump','run','step','hinge','press','carry','burpee','kneel'].map(v=>`<option ${x.visual===v?'selected':''} value="${v}">${v}</option>`).join('')}</select></div><div class="row section"><button class="btn" type="submit">Opslaan</button></div></form>`;render()}
function saveExercise(e){e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(f.entries());x.muscles=f.getAll('muscles');x.visual=exercises.find(y=>y.id===editId)?.visual||'standing';x.id=editId||uid();if(editId)exercises=exercises.map(e=>e.id===editId?x:e);else exercises.unshift(x);save();modal=null;render();toast('Oefening opgeslagen')}
function removeExercise(id){if(!confirm('Oefening uit de bibliotheek verwijderen? Oude opgeslagen trainingen behouden een kopie.'))return;exercises=exercises.filter(x=>x.id!==id);save();modal=null;render();toast('Oefening verwijderd')}
function closeModal(){modal=null;render()}
function updateDraft(k,v){draft[k]=v;save()}function addExercise(id,part){draft[part].push(id);save();render();toast('Oefening toegevoegd')}function removeDraft(part,i){draft[part].splice(i,1);save();render()}function moveDraft(part,i,d){let j=i+d;if(j<0||j>=draft[part].length)return;[draft[part][i],draft[part][j]]=[draft[part][j],draft[part][i]];save();render()}
function formSelect(part){let selected=forms.find(f=>f.id===draft[part+'Form'])||forms[0];return `<div class="form-grid"><div><label>Trainingsvorm</label><select class="field" onchange="chooseForm('${part}',this.value)">${forms.map(f=>`<option value="${f.id}" ${selected.id===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div><label>Aantal rondes</label><input class="field" type="number" min="1" max="20" value="${draft[part+'Rounds']}" onchange="updateDraft('${part}Rounds',Math.max(1,+this.value))"></div>${selected.mode==='time'?`<div><label>Werk (seconden)</label><input class="field" type="number" min="1" value="${draft[part+'Work']}" onchange="updateDraft('${part}Work',Math.max(1,+this.value))"></div><div><label>Rust (seconden)</label><input class="field" type="number" min="0" value="${draft[part+'Rest']}" onchange="updateDraft('${part}Rest',Math.max(0,+this.value))"></div>`:`<p class="note">Trainer gaat handmatig door naar de volgende oefening. Vermeld herhalingen bij de trainingsnotities.</p>`}</div>`}
function chooseForm(part,id){let f=forms.find(f=>f.id===id);draft[part+'Form']=id;draft[part+'Work']=f.work;draft[part+'Rest']=f.rest;draft[part+'Rounds']=f.rounds;save();render()}
function partBuilder(part,title){return `<div class="panel"><div class="row between"><h2>${title}</h2><span class="pill">${draft[part].length} oefeningen</span></div>${formSelect(part)}<div class="section stack">${draft[part].map((id,i)=>{let x=exercises.find(x=>x.id===id);return `<div class="step"><span class="num">${i+1}</span><div style="flex:1"><b>${esc(x?.name||'Verwijderde oefening')}</b><div class="mini">${esc(x?.goal||'')} · ${esc(x?.material||'Geen')}</div></div><button class="btn small ghost" onclick="moveDraft('${part}',${i},-1)">↑</button><button class="btn small ghost" onclick="moveDraft('${part}',${i},1)">↓</button><button class="btn small danger" onclick="removeDraft('${part}',${i})">✕</button></div>`}).join('')||'<div class="empty">Nog geen oefeningen geselecteerd.</div>'}</div><div class="section"><label>Oefening toevoegen</label><select class="field" id="pick_${part}"><option value="">Kies een oefening...</option>${exercises.filter(x=>part==='core'?x.category==='Core':x.category==='Kracht & conditie').sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><button style="margin-top:9px" class="btn secondary" onclick="let id=$('#pick_${part}').value;if(id)addExercise(id,'${part}')">+ Toevoegen</button></div></div>`}


const FOCUSES=['Gevarieerd / full-body','Corestabiliteit','Been- en bilkracht','Explosiviteit','Krachtuithoudingsvermogen','Conditie','Balans en coördinatie','Blessurepreventie','Mobiliteit'];const LEVELS=['Licht','Gemiddeld','Zwaar'];function trainingFormName(t){return [t.coreFormData?.name,t.mainFormData?.name].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')||'Onbekend'}function builder(){return `<div class="eyebrow">Vooraf voorbereiden · herbruikbaar</div><h1 class="headline">Training maken</h1><p class="lead">Maak een training zonder vaste datum. Kies op woensdag vanuit de opgeslagen trainingen welke je gaat geven.</p><div class="panel section"><div class="form-grid"><div><label>Naam van de training</label><input class="field" value="${esc(draft.name)}" oninput="updateDraft('name',this.value)"></div><div><label>Nadruk / beoogd effect</label><select class="field" onchange="updateDraft('focus',this.value)">${FOCUSES.map(v=>`<option ${draft.focus===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div><label>Moeilijkheidsgraad</label><select class="field" onchange="updateDraft('difficulty',this.value)">${LEVELS.map(v=>`<option ${draft.difficulty===v?'selected':''}>${v}</option>`).join('')}</select></div></div></div><div class="split section"><div>${partBuilder('core','01 · Core')}</div><div>${partBuilder('main','02 · Kerntraining')}</div></div><div class="panel section"><h2>Vaste onderdelen</h2><label class="check"><input type="checkbox" ${draft.jane?'checked':''} onchange="updateDraft('jane',this.checked)">03 · Jane Fonda complex (onderdeel van rekken)</label><label class="check"><input type="checkbox" ${draft.stretch?'checked':''} onchange="updateDraft('stretch',this.checked)">04 · Rekken</label><hr class="divider"><label>Trainingsnotities / herhalingen</label><textarea class="field" oninput="updateDraft('notes',this.value)" placeholder="Bijvoorbeeld: 12 herhalingen per oefening; 2 rondes">${esc(draft.notes)}</textarea><div class="row section"><button class="btn" onclick="saveTraining()">Training opslaan</button><button class="btn ghost" onclick="resetDraft()">Leegmaken</button></div></div>`}
function snapshot(){let copy=JSON.parse(JSON.stringify(draft));copy.id=uid();copy.savedAt=new Date().toISOString();copy.core=copy.core.map(id=>exercises.find(x=>x.id===id)).filter(Boolean).map(x=>({...x}));copy.main=copy.main.map(id=>exercises.find(x=>x.id===id)).filter(Boolean).map(x=>({...x}));copy.pairs=[];copy.coreFormData={...forms.find(f=>f.id===draft.coreForm)};copy.mainFormData={...forms.find(f=>f.id===draft.mainForm)};copy.evaluation=null;return copy}
function saveTraining(){if(!draft.core.length&&!draft.main.length){toast('Voeg eerst oefeningen toe');return}let t=snapshot();trainings.unshift(t);save();toast('Training toegevoegd aan de collectie');navigate('history')}
function resetDraft(){if(!confirm('Huidige concepttraining leegmaken?'))return;draft.core=[];draft.main=[];draft.pairs=[];draft.name='Weektraining';draft.notes='';draft.focus='Gevarieerd / full-body';draft.difficulty='Gemiddeld';save();render()}
function startFromDraft(){if(!draft.core.length&&!draft.main.length){toast('Voeg eerst oefeningen toe');return}startTraining(snapshot())}
function startTraining(t){activeTraining=t;stage=t.core.length?'core':'main';position=0;phase='work';remaining=stage==='core'?+t.coreWork:+t.mainWork;running=false;view='run';render()}
function sequence(){if(!activeTraining)return[];let t=activeTraining;let seq=[];for(let part of ['core','main']){let arr=t[part],rounds=Math.max(1,+t[part+'Rounds']||1);for(let r=0;r<rounds;r++)for(let x of arr)seq.push({x,part,round:r+1,mode:t[part+'FormData']?.mode||'time',work:+t[part+'Work'],rest:+t[part+'Rest']})}return seq}
function launchSelected(){let t=trainings.find(x=>x.id===$('#templateChoice').value);if(!t)return;let date=$('#sessionDate').value;if(!date){toast('Kies een datum');return}let session={id:uid(),templateId:t.id,name:t.name,date,trainers:{core:$('#trainerCore').value.trim(),main:$('#trainerMain').value.trim(),stretch:$('#trainerStretch').value.trim()},evaluation:null};sessions.push(session);save();startTraining({...t,id:session.id,sessionId:session.id})}
function openSessionEvaluation(id){let x=sessions.find(s=>s.id===id);if(!x)return;let e=x.evaluation||{score:4,good:'',improve:'',repeat:'ja'};modal=`<div class="row between"><h2>Evaluatie · ${esc(x.name)} (${esc(x.date)})</h2><button class="btn ghost small" onclick="closeModal()">✕</button></div><p class="note">Trainers: core ${esc(x.trainers?.core||'—')} · kern ${esc(x.trainers?.main||'—')} · rekken/Jane Fonda ${esc(x.trainers?.stretch||'—')}</p><form onsubmit="saveSessionEvaluation(event,'${id}')"><label>Beoordeling</label><select name="score" class="field">${[1,2,3,4,5].map(n=>`<option ${+e.score===n?'selected':''}>${n}</option>`).join('')}</select><div class="section"><label>Wat ging goed?</label><textarea name="good" class="field">${esc(e.good)}</textarea></div><div class="section"><label>Wat kan beter?</label><textarea name="improve" class="field">${esc(e.improve)}</textarea></div><div class="section"><label>Herhalen?</label><select name="repeat" class="field">${['ja','met aanpassingen','nee'].map(n=>`<option ${e.repeat===n?'selected':''}>${n}</option>`).join('')}</select></div><button class="btn section">Evaluatie opslaan</button></form>`;render()}
function saveSessionEvaluation(ev,id){ev.preventDefault();let x=sessions.find(s=>s.id===id);if(x)x.evaluation=Object.fromEntries(new FormData(ev.target));save();modal=null;render();toast('Evaluatie opgeslagen')}
function runPage(){if(!activeTraining)return `<div class="eyebrow">Woensdag · trainingsdag</div><h1 class="headline">Training geven</h1><p class="lead">Kies een eerder voorbereide training. De datum wordt pas bij uitvoering vastgelegd.</p><div class="panel section"><label>Trainingsdatum</label><input id="sessionDate" class="field" type="date" value="${new Date().toLocaleDateString('sv-SE')}"><label class="section">Kies een training</label><select id="templateChoice" class="field">${trainings.map(t=>`<option value="${t.id}" ${selectedTemplateId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="form-grid section"><div><label>Trainer core / buikspieren</label><input id="trainerCore" class="field" placeholder="Naam trainer"></div><div><label>Trainer kerntraining</label><input id="trainerMain" class="field" placeholder="Naam trainer"></div><div><label>Trainer rekken + Jane Fonda complex</label><input id="trainerStretch" class="field" placeholder="Naam trainer"></div></div><button class="btn section" ${trainings.length?'':'disabled'} onclick="launchSelected()">▶ Gekozen training starten</button></div><button class="btn secondary section" onclick="navigate('history')">Bekijk alle trainingen</button>`;let seq=sequence(),item=seq[position];if(!item)return `<div class="panel"><h2>Training afgerond!</h2><p>De oefeningen zijn voltooid. ${activeTraining.jane?'Vergeet het Jane Fonda complex niet. ':''}${activeTraining.stretch?'Sluit af met rekken.':''}</p><div class="row"><button class="btn" onclick="finishTraining()">Naar evaluatie</button><button class="btn secondary" onclick="resetRun()">Opnieuw</button></div></div>`;let next=seq[position+1],manual=item.mode==='manual';return `<div class="eyebrow">Gezamenlijke trainingsmodus</div><h1 class="headline">${esc(activeTraining.name)}</h1><div class="row between"><span class="pill">${item.part==='core'?'01 · Core':'02 · Kern'} · ronde ${item.round}</span><span class="pill">Oefening ${position+1} / ${seq.length}</span></div><div class="panel section" style="text-align:center"><div class="eyebrow">${manual?'Op herhalingen':phase==='work'?'WERKEN':'RUST'}</div><h2 style="font-size:clamp(25px,4vw,44px);margin:12px 0">${esc(item.x.name)}</h2><div class="timer ${phase==='rest'?'rest':''}">${manual?'↪':`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`}</div><div class="progress"><div style="width:${((position+(phase==='rest'?.5:0))/seq.length)*100}%"></div></div><div class="row" style="justify-content:center;margin-top:20px"><button class="btn" onclick="toggleRun()">${running?'❚❚ Pauze':'▶ Start'}</button><button class="btn secondary" onclick="nextStep()">Volgende →</button><button class="btn ghost" onclick="prevStep()">← Vorige</button><button class="btn ghost" onclick="resetRun()">Opnieuw</button></div><p class="note">${manual?'Ga na het gewenste aantal herhalingen handmatig naar de volgende oefening.':'De timer geeft een geluidssignaal bij wisselingen.'}</p></div><div class="split section"><div class="panel"><h3>Uitvoering</h3><p>${esc(item.x.execution)}</p><h3>Aandachtspunten</h3><p>${esc(item.x.attention)}</p></div><div class="panel"><h3>Volgende oefening</h3><p>${next?esc(next.x.name):'Laatste oefening van de reeks'}</p>${next?draw(next.x.visual):''}<hr class="divider"><h3>Na de oefeningen</h3><p class="muted">${activeTraining.jane?'✓ Jane Fonda complex':''} ${activeTraining.stretch?'✓ Rekken':''}</p></div></div>`}
function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=740;g.gain.value=.08;o.start();o.stop(a.currentTime+.15);setTimeout(()=>a.close(),300)}catch{}}
function stopTimer(){running=false;if(interval)clearInterval(interval);interval=null}function toggleRun(){let item=sequence()[position];if(!item||item.mode==='manual')return;running=!running;if(running){lastTick=Date.now();interval=setInterval(()=>{let now=Date.now(),delta=Math.floor((now-lastTick)/1000);if(delta<1)return;lastTick+=delta*1000;remaining-=delta;if(remaining<=0){beep();if(phase==='work'&&item.rest>0&&position<sequence().length-1){phase='rest';remaining=item.rest}else{position++;phase='work';remaining=sequence()[position]?.work||0}}render()},250)}else stopTimer();render()}
function nextStep(){stopTimer();position=Math.min(position+1,sequence().length);phase='work';remaining=sequence()[position]?.work||0;render()}function prevStep(){stopTimer();position=Math.max(0,position-1);phase='work';remaining=sequence()[position]?.work||0;render()}function resetRun(){stopTimer();position=0;phase='work';remaining=sequence()[0]?.work||0;render()}
function finishTraining(){stopTimer();let id=activeTraining.sessionId;activeTraining=null;view='history';render();if(id)openSessionEvaluation(id)}
let historyFilterForm='Alle',historyFilterLevel='Alle',historyFilterFocus='Alle';function setHistoryFilter(key,val){if(key==='form')historyFilterForm=val;if(key==='level')historyFilterLevel=val;if(key==='focus')historyFilterFocus=val;render()}function historyPage(){let shown=trainings.filter(t=>(historyFilterForm==='Alle'||trainingFormName(t).includes(historyFilterForm))&&(historyFilterLevel==='Alle'||(t.difficulty||'Gemiddeld')===historyFilterLevel)&&(historyFilterFocus==='Alle'||(t.focus||'Gevarieerd / full-body')===historyFilterFocus));return `<div class="row between"><div><div class="eyebrow">Trainingscollectie</div><h1 class="headline">Voorbereide trainingen</h1><p class="lead">Maak trainingen vooraf. Op woensdag kies je een training uit deze collectie. Eerdere uitvoeringen en evaluaties blijven apart bewaard.</p></div><button class="btn" onclick="navigate('builder')">+ Training ontwerpen</button></div><div class="form-grid section"><div><label>Trainingsvorm</label><select class="field" onchange="setHistoryFilter('form',this.value)"><option>Alle</option>${forms.map(f=>`<option value="${esc(f.name)}" ${historyFilterForm===f.name?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div><label>Moeilijkheidsgraad</label><select class="field" onchange="setHistoryFilter('level',this.value)"><option>Alle</option>${LEVELS.map(v=>`<option ${historyFilterLevel===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Nadruk / effect</label><select class="field" onchange="setHistoryFilter('focus',this.value)"><option>Alle</option>${FOCUSES.map(v=>`<option ${historyFilterFocus===v?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="stack section">${shown.map(t=>`<div class="panel"><div class="row between"><div><span class="tag">Opgeslagen training</span><h2 style="margin:7px 0">${esc(t.name)}</h2><p class="mini">${esc(t.difficulty||'Gemiddeld')} · ${esc(t.focus||'Gevarieerd / full-body')} · ${esc(trainingFormName(t))}</p><p class="mini">${t.core.length} core · ${t.main.length} kern · ${t.jane?'Jane Fonda · ':''}${t.stretch?'Rekken':''}</p></div><span class="pill">${sessions.filter(x=>x.templateId===t.id).length}× uitgevoerd</span></div><div class="row section"><button class="btn small" onclick="startSaved('${t.id}')">▶ Kies voor trainingsdag</button><button class="btn small secondary" onclick="viewSaved('${t.id}')">Bekijk</button><button class="btn small secondary" onclick="duplicate('${t.id}')">Kopieer/bewerk</button><button class="btn small danger" onclick="deleteTraining('${t.id}')">Verwijder</button></div></div>`).join('')||'<div class="empty">Nog geen trainingen voorbereid. Maak je eerste training in Training maken.</div>'}</div><h2 class="section">Uitgevoerde trainingen & evaluaties</h2><div class="stack">${sessions.slice().reverse().map(x=>{let t=trainings.find(t=>t.id===x.templateId);return `<div class="panel"><div class="row between"><div><span class="tag">${esc(x.date)}</span><h3>${esc(x.name)}</h3><p class="mini">Trainers: core ${esc(x.trainers?.core||'niet ingevuld')} · kern ${esc(x.trainers?.main||'niet ingevuld')} · rekken/Jane Fonda ${esc(x.trainers?.stretch||'niet ingevuld')}</p><p class="mini">${x.evaluation?'★ '+x.evaluation.score+'/5 · '+esc(x.evaluation.good):'Nog niet geëvalueerd'}</p></div><button class="btn small secondary" onclick="openSessionEvaluation('${x.id}')">${x.evaluation?'Evaluatie bekijken / wijzigen':'Evalueren'}</button></div></div>`}).join('')||'<div class="empty">Nog geen trainingen uitgevoerd.</div>'}</div>`}
function startSaved(id){let t=trainings.find(t=>t.id===id);if(!t)return;selectedTemplateId=id;activeTraining=null;view='run';render()}function viewSaved(id){let t=trainings.find(t=>t.id===id);if(!t)return;modal=`<div class="row between"><h2>${esc(t.name)}</h2><button class="btn ghost small" onclick="closeModal()">✕</button></div><p class="tag">${esc(t.difficulty||'Gemiddeld')} · ${esc(t.focus||'Gevarieerd / full-body')} · ${esc(trainingFormName(t))}</p>${['core','main'].map((p,i)=>`<h3>${i+1}. ${p==='core'?'Core':'Kerntraining'}</h3><p class="mini">${esc(t[p+'FormData']?.name||'')} · ${t[p+'Rounds']} ronde(s)</p>${t[p].map((x,j)=>`<div class="step"><span class="num">${j+1}</span><div><b>${esc(x.name)}</b><p class="mini">${esc(x.execution)} · ${esc(x.attention)}</p></div></div>`).join('')}`).join('')}<p>3. Jane Fonda complex (bij rekken): ${t.jane?'Ja':'Nee'}</p><p>4. Rekken: ${t.stretch?'Ja':'Nee'}</p><p class="note">Notities: ${esc(t.notes)}</p>${t.evaluation?`<hr class="divider"><h3>Evaluatie · ${t.evaluation.score}/5</h3><p>${esc(t.evaluation.good)}</p><p>${esc(t.evaluation.improve)}</p>`:''}`;render()}
function duplicate(id){let t=trainings.find(t=>t.id===id);if(!t)return;draft={...t,core:t.core.map(x=>x.id).filter(id=>exercises.some(e=>e.id===id)),main:t.main.map(x=>x.id).filter(id=>exercises.some(e=>e.id===id)),pairs:[],name:t.name+' (kopie)',date:nextWednesday()};save();navigate('builder');toast('Training gekopieerd')}
function deleteTraining(id){if(!confirm('Opgeslagen training en evaluatie verwijderen?'))return;trainings=trainings.filter(t=>t.id!==id);save();render()}
function openEvaluation(id){let t=trainings.find(t=>t.id===id);if(!t)return;let e=t.evaluation||{score:4,good:'',improve:'',repeat:'ja'};modal=`<div class="row between"><h2>Evaluatie · ${esc(t.name)}</h2><button class="btn ghost small" onclick="closeModal()">✕</button></div><form onsubmit="saveEvaluation(event,'${id}')"><label>Beoordeling (1–5)</label><select name="score" class="field">${[1,2,3,4,5].map(n=>`<option ${+e.score===n?'selected':''}>${n}</option>`).join('')}</select><div class="section"><label>Wat ging goed?</label><textarea name="good" class="field">${esc(e.good)}</textarea></div><div class="section"><label>Wat kan beter?</label><textarea name="improve" class="field">${esc(e.improve)}</textarea></div><div class="section"><label>Herhalen?</label><select name="repeat" class="field">${['ja','met aanpassingen','nee'].map(x=>`<option ${e.repeat===x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn section" type="submit">Evaluatie opslaan</button></form>`;render()}
function saveEvaluation(ev,id){ev.preventDefault();let t=trainings.find(t=>t.id===id);t.evaluation=Object.fromEntries(new FormData(ev.target));save();modal=null;render();toast('Evaluatie opgeslagen')}
function formsPage(){return `<div class="row between"><div><div class="eyebrow">Flexibele werkvormen</div><h1 class="headline">Trainingsvormen</h1><p class="lead">Iedere trainer kan vormen toevoegen of aanpassen. Gebruik tijdgestuurde of handmatige doorgang.</p></div><button class="btn" onclick="editForm(null)">+ Nieuwe vorm</button></div><div class="grid section">${forms.map(f=>`<div class="panel"><span class="pill">${f.mode==='time'?'Timer':'Handmatig'}</span><h2>${esc(f.name)}</h2><p class="lead">${esc(f.description)}</p><p class="mini">${f.mode==='time'?`${f.work}s werk · ${f.rest}s rust · `:''}${f.rounds} ronde(s)</p><button class="btn secondary small" onclick="editForm('${f.id}')">Bewerk</button> <button class="btn danger small" onclick="removeForm('${f.id}')">Verwijder</button></div>`).join('')}</div>`}
function editForm(id){let f=forms.find(f=>f.id===id)||{name:'',description:'',mode:'time',work:45,rest:15,rounds:1};editId=id;modal=`<div class="row between"><h2>${id?'Trainingsvorm wijzigen':'Nieuwe trainingsvorm'}</h2><button class="btn ghost small" onclick="closeModal()">✕</button></div><form onsubmit="saveForm(event)"><label>Naam</label><input class="field" required name="name" value="${esc(f.name)}"><div class="section"><label>Beschrijving</label><textarea class="field" name="description">${esc(f.description)}</textarea></div><div class="form-grid section"><div><label>Werking</label><select class="field" name="mode"><option value="time" ${f.mode==='time'?'selected':''}>Timer</option><option value="manual" ${f.mode==='manual'?'selected':''}>Handmatig</option></select></div><div><label>Rondes</label><input class="field" name="rounds" type="number" min="1" value="${f.rounds}"></div><div><label>Werk (sec)</label><input class="field" name="work" type="number" min="1" value="${f.work}"></div><div><label>Rust (sec)</label><input class="field" name="rest" type="number" min="0" value="${f.rest}"></div></div><button class="btn section">Opslaan</button></form>`;render()}
function saveForm(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.id=editId||uid();for(let k of ['work','rest','rounds'])f[k]=Math.max(k==='rest'?0:1,+f[k]||0);if(editId)forms=forms.map(x=>x.id===editId?f:x);else forms.push(f);save();modal=null;render();toast('Trainingsvorm opgeslagen')}
function removeForm(id){if(forms.length<=1){toast('Minimaal één vorm nodig');return}if(!confirm('Trainingsvorm verwijderen?'))return;forms=forms.filter(f=>f.id!==id);for(let part of ['core','main'])if(draft[part+'Form']===id)draft[part+'Form']=forms[0].id;save();render()}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exercises,forms,trainings,draft,sessions},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jane-fonda-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.exercises)||!Array.isArray(d.forms)||!Array.isArray(d.trainings))throw Error();if(!confirm('Huidige gegevens vervangen door de import?'))return;exercises=d.exercises;forms=d.forms;trainings=d.trainings;sessions=Array.isArray(d.sessions)?d.sessions:[];draft=d.draft||draft;save();render();toast('Gegevens geïmporteerd')}catch{alert('Ongeldig back-upbestand')}};r.readAsText(f)}
function render(preserveFocus=false){let focus=preserveFocus?document.activeElement:null,pos=focus?.selectionStart;$('#app').innerHTML=header()+`<main class="page">${({home,library,builder,run:runPage,history:historyPage,forms:formsPage}[view])()}</main><footer>Jane Fonda Fanclub · AV '34 · Prototype v9 · Lokale opslag, geen centrale synchronisatie</footer>`+(modal?`<div class="modal"><div class="panel">${modal}</div></div>`:'');if(preserveFocus&&focus){let n=$('input[placeholder="Zoek op naam, doel of uitvoering..."]');if(n){n.focus();n.setSelectionRange(pos,pos)}}}render();
</script></body></html>
